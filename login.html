<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SkillBridge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
    --orange:#ff7a18;
    --orange2:#ff9a44;
    --navy:#101a2d;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#72809a;
    --line:#e4e9f1;
    --shadow:0 18px 50px rgba(16,26,45,.12);
    --success:#16a34a;
    --error:#dc2626;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    min-height:100vh;
}

.page{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.left{
    background:linear-gradient(135deg,var(--navy),#1c3152);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
    position:relative;
    overflow:hidden;
}

.left::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:rgba(255,122,24,.08);
    top:-150px;
    right:-150px;
}

.logo{
    position:absolute;
    top:30px;
    left:60px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.left h1{
    font-size:42px;
    line-height:1.2;
    margin-bottom:15px;
}

.left h1 span{
    color:#ff9a44;
}

.left p{
    color:#c7d2e2;
    line-height:1.8;
    max-width:500px;
}

.right{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:450px;
    background:var(--card);
    border-radius:20px;
    padding:35px;
    box-shadow:var(--shadow);
    animation:fadeUp .6s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card-header{
    text-align:center;
    margin-bottom:25px;
}

.card-header .icon{
    width:60px;
    height:60px;
    border-radius:15px;
    background:#fff0e5;
    color:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:24px;
    margin-bottom:15px;
}

.card-header h2{
    margin-bottom:5px;
}

.card-header p{
    color:var(--muted);
    font-size:14px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
    font-size:14px;
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#8fa1b6;
}

.input-wrap input{
    width:100%;
    height:48px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 15px 0 42px;
    outline:none;
    transition:.3s;
    background:#fafbfd;
}

.input-wrap input:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,122,24,.12);
}

.eye{
    left:auto !important;
    right:15px;
    cursor:pointer;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    color:var(--orange);
    text-decoration:none;
    font-weight:600;
}

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
}

.login-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.message.success{
    display:block;
    color:var(--success);
    background:#ecfdf3;
    border:1px solid #bbf7d0;
}

.message.error{
    display:block;
    color:var(--error);
    background:#fef2f2;
    border:1px solid #fecaca;
}

.register{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
}

.register a{
    color:var(--orange);
    text-decoration:none;
    font-weight:700;
}

@media(max-width:900px){
    .page{
        grid-template-columns:1fr;
    }

    .left{
        display:none;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- LEFT SIDE -->
    <div class="left">

        <div class="logo">
            <div class="logo-box">SB</div>
            <h3>SkillBridge</h3>
        </div>

        <h1>
            Welcome Back to <span>SkillBridge</span>
        </h1>

        <p>
            Continue your learning journey. Access coding practice,
            aptitude preparation, study materials, mock tests and
            track your progress from one dashboard.
        </p>

    </div>


    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="card">

            <div class="card-header">

                <div class="icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>

                <h2>Login</h2>

                <p>Sign in to continue learning</p>

            </div>


            <!-- API MESSAGE -->
            <div id="message" class="message"></div>


            <form id="loginForm">

                <!-- EMAIL -->
                <div class="field">

                    <label>Email Address</label>

                    <div class="input-wrap">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="field">

                    <label>Password</label>

                    <div class="input-wrap">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <i
                            class="fa-regular fa-eye eye"
                            onclick="togglePassword(this)">
                        </i>

                    </div>

                </div>


                <!-- OPTIONS -->
                <div class="options">

                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">

                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Login

                </button>

            </form>


            <!-- REGISTER -->
            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Register Now
                </a>

            </div>

        </div>

    </div>

</div>


<script>

/* ==========================================
   SKILLBRIDGE BACKEND API
========================================== */

const API_URL = "http://localhost:5000";


/* ==========================================
   PASSWORD SHOW / HIDE
========================================== */

function togglePassword(icon){

    const input = document.getElementById("password");

    if(input.type === "password"){

        input.type = "text";

        icon.classList.replace(
            "fa-eye",
            "fa-eye-slash"
        );

    }else{

        input.type = "password";

        icon.classList.replace(
            "fa-eye-slash",
            "fa-eye"
        );
    }
}


/* ==========================================
   MESSAGE FUNCTION
========================================== */

function showMessage(message, type){

    const messageBox =
        document.getElementById("message");

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;
}


/* ==========================================
   LOGIN API
========================================== */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();

    const loginBtn =
        document.getElementById("loginBtn");


    /* Clear previous message */

    document.getElementById("message")
        .className = "message";


    /* Frontend validation */

    if(!email || !password){

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }


    /* Loading state */

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


    try{

        /* Send request to backend */

        const response = await fetch(
            `${API_URL}/api/auth/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        /* Convert response to JSON */

        const data = await response.json();


        /* Login failed */

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Invalid email or password"
            );
        }


        /* ==========================================
           SAVE JWT TOKEN
        ========================================== */

        localStorage.setItem(
            "skillbridge_token",
            data.token
        );


        /* ==========================================
           SAVE USER DETAILS
        ========================================== */

        localStorage.setItem(
            "skillbridge_user",
            JSON.stringify(data.user)
        );


        /* Optional remember email */

        const rememberMe =
            document.getElementById("rememberMe")
            .checked;

        if(rememberMe){

            localStorage.setItem(
                "skillbridge_email",
                email
            );

        }else{

            localStorage.removeItem(
                "skillbridge_email"
            );
        }


        /* Success message */

        showMessage(
            "Login successful! Redirecting...",
            "success"
        );


        /* Redirect */

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        }, 800);


    }catch(error){

        console.error(
            "Login Error:",
            error
        );


        /* Backend unavailable */

        if(
            error instanceof TypeError &&
            error.message.includes("fetch")
        ){

            showMessage(
                "Cannot connect to SkillBridge server. Please make sure the backend is running on port 5000.",
                "error"
            );

        }else{

            showMessage(
                error.message ||
                "Login failed. Please try again.",
                "error"
            );
        }


        /* Restore button */

        loginBtn.disabled = false;

        loginBtn.innerHTML =
            '<i class="fa-solid fa-arrow-right-to-bracket"></i> Login';
    }

});


/* ==========================================
   LOAD REMEMBERED EMAIL
========================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const savedEmail =
            localStorage.getItem(
                "skillbridge_email"
            );

        if(savedEmail){

            document.getElementById("email")
                .value = savedEmail;

            document.getElementById("rememberMe")
                .checked = true;
        }

    }
);

</script>

</body>
</html>
