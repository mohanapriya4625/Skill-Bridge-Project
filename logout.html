<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge - Logout</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6b00,#ff9500);
}

.logout-card{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    width:450px;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

.icon{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:#e8fff0;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}

.icon i{
    font-size:50px;
    color:#28a745;
}

h1{
    color:#333;
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    background:#ff6b00;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:.3s;
}

.btn:hover{
    background:#e55f00;
}

.countdown{
    margin-top:20px;
    color:#888;
    font-size:14px;
}
</style>
</head>
<body>

<div class="logout-card">

    <div class="icon">
        <i class="fas fa-check"></i>
    </div>

    <h1>Logged Out Successfully</h1>

    <p>
        Thank you for using SkillBridge Placement Preparation Portal.
        You have been securely logged out.
    </p>

    <a href="index.html" class="btn">
        Return to Home
    </a>

    <div class="countdown">
        Redirecting to Home Page in
        <span id="timer">5</span> seconds...
    </div>

</div>

<script>
let seconds = 5;

const timer = document.getElementById("timer");

const countdown = setInterval(() => {
    seconds--;
    timer.textContent = seconds;

    if(seconds <= 0){
        clearInterval(countdown);
        window.location.href = "index.html";
    }
}, 1000);
</script>

</body>
</html>
